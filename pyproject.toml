[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "HabitTracker"
version = "1.1.0"
description = "Simple Habit Tracker application"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.txt" }
authors = [
    { name = "CorgiCapyCode" }
]

dependencies = [
    "sqlalchemy>=2.0.23",
]

[project.scripts]
habit-tracker = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
